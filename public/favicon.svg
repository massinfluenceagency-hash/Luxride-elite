<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A765;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8952A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>

  <!-- Gold border -->
  <rect x="1" y="1"
        width="29" height="29"
        rx="5"
        fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Car silhouette icon -->
  <g transform="translate(3, 9)">
    <!-- Car body -->
    <rect x="1" y="5"
          width="16" height="6"
          rx="1" fill="url(#goldGrad)"/>
    <!-- Car roof -->
    <path d="M4 5
             L5 2
             L13 2
             L14 5 Z"
          fill="url(#goldGrad)"/>
    <!-- Wheels -->
    <circle cx="5" cy="12"
            r="2" fill="#0A0A0A" stroke="url(#goldGrad)"
            stroke-width="1"/>
    <circle cx="14" cy="12"
            r="2" fill="#0A0A0A" stroke="url(#goldGrad)"
            stroke-width="1"/>
  </g>

  <!-- LR text -->
  <text x="16" y="29"
        font-family="Georgia, serif" font-size="3"
        font-weight="700" fill="url(#goldGrad)"
        text-anchor="middle" letter-spacing="1">LUXRIDE</text>
</svg>